<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#060a08" />
  <meta name="description" content="Accès restreint." />
  <title>Accès sécurisé</title>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔒</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
</head>

<body class="page page--lock" data-page="lock" data-fx="">

  <audio id="pageMusic" src="assets/musique.mp3" loop preload="auto"></audio>
  <button type="button" class="music-toggle" id="musicToggle" aria-pressed="false"
    aria-label="Activer la musique">🎵</button>

  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

  <main class="stage">
    <section class="vault" aria-labelledby="main-title">

      <header class="vault__bar" aria-hidden="true">
        <span class="vault__dots"><i></i><i></i><i></i></span>
        <span class="vault__path">secure://acces</span>
      </header>

      <div class="vault__body">

        <div class="vault__icon" id="lockIcon" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="84" height="84" fill="none" stroke="currentColor"
            stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path class="vault__shackle" d="M20 29v-9a12 12 0 0 1 24 0v9" />
            <rect x="13" y="29" width="38" height="27" rx="5" fill="rgba(43,255,136,0.07)" />
            <circle cx="32" cy="40" r="3.4" />
            <path d="M32 43.4V49" />
          </svg>
        </div>

        <h1 class="vault__title glitch" id="main-title" data-text="ACCÈS RESTREINT">ACCÈS RESTREINT</h1>

        <p class="vault__status"><span class="vault__prompt">&gt;</span> Authentification requise<span
            class="vault__cursor" aria-hidden="true"></span></p>

        <form class="vault__form" id="lockForm" autocomplete="off" novalidate>
          <label class="vault__label" for="lockInput">Entrez votre date de naissance pour entrer</label>
          <input id="lockInput" class="vault__input" type="text" inputmode="numeric"
            autocomplete="off" autocapitalize="off" spellcheck="false"
            placeholder="JJ/MM/AAAA" maxlength="10" aria-describedby="lockMsg" />
          <button type="submit" class="vault__btn" id="lockBtn">Déverrouiller</button>
        </form>

        <p class="vault__msg" id="lockMsg" role="status" aria-live="polite"></p>

        <div class="vault__progress" id="lockProgress" hidden aria-hidden="true"><span></span></div>

      </div>

      <footer class="vault__foot" aria-hidden="true">
        <span>Connexion chiffrée</span><span>●</span><span>TLS 1.3</span>
      </footer>

    </section>
  </main>

  <footer class="site-footer">
    <p>© Léon Corazón — fait avec le cœur</p>
  </footer>

  <div class="page-veil" aria-hidden="true"></div>

  <script src="js/script.js"></script>
</body>

</html>
