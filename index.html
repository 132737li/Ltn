<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff4f9a" />
  <meta name="description" content="Une surprise protégée, rien que pour toi." />
  <title>Une surprise pour toi 🔒</title>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
</head>

<body class="page page--lock" data-page="lock" data-fx="stars,petals">

  <audio id="pageMusic" src="assets/musique.mp3" loop preload="auto"></audio>
  <button type="button" class="music-toggle" id="musicToggle" aria-pressed="false"
    aria-label="Activer la musique">🎵</button>

  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

  <main class="stage">
    <section class="card card--lock" aria-labelledby="main-title">

      <div class="lock-emblem" id="lockIcon" aria-hidden="true">🔒</div>

      <span class="badge">Chut… c’est un secret 🤫</span>

      <h1 class="title" id="main-title">Cette surprise est protégée</h1>

      <p class="lead">Quelqu’un a préparé quelque chose pour toi.</p>

      <form class="lock-form" id="lockForm" autocomplete="off" novalidate>
        <label class="lock-label" for="lockInput">Entrez votre date de naissance pour entrer</label>
        <input id="lockInput" class="lock-input" type="text" inputmode="numeric"
          autocomplete="off" autocapitalize="off" spellcheck="false"
          placeholder="JJ/MM/AAAA" maxlength="10" aria-describedby="lockMsg" />
        <button type="submit" class="btn btn--primary btn--pulse" id="lockBtn">Ouvrir 💗</button>
      </form>

      <p class="lock-msg" id="lockMsg" role="status" aria-live="polite"></p>

    </section>
  </main>

  <footer class="site-footer">
    <p>© Léon Corazón — fait avec le cœur</p>
  </footer>

  <div class="page-veil" aria-hidden="true"></div>

  <script src="js/script.js"></script>
</body>

</html>
