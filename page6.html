<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff4f9a" />
  <meta name="description" content="Un petit quiz pour voir si tu me connais vraiment." />
  <title>À quel point tu me connais ?</title>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
</head>

<body class="page page--quiz" data-page="quiz" data-step="6" data-steps="11" data-fx="stars,petals">

  <audio id="pageMusic" src="assets/musique2.mp3" loop preload="auto"></audio>
  <button type="button" class="music-toggle" id="musicToggle" aria-pressed="false"
    aria-label="Activer la musique">🎵</button>

  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

  <main class="stage">
    <section class="card" aria-labelledby="main-title">

      <span class="badge">Petit quiz 🎯</span>

      <h1 class="title" id="main-title">À quel point tu me connais ?</h1>

      <div class="quiz" id="quiz">
        <div class="progress" aria-hidden="true"><span class="progress__bar" id="quizBar"></span></div>
        <p class="quiz__count" id="quizCount"></p>
        <h2 class="quiz__q" id="quizQ" aria-live="polite"></h2>
        <div class="quiz__options" id="quizOptions" role="group" aria-labelledby="quizQ"></div>
        <p class="quiz__feedback" id="quizFeedback" role="status" aria-live="polite"></p>
        <div class="actions">
          <button type="button" class="btn btn--primary" id="quizNextBtn" hidden>Question suivante ›</button>
        </div>
      </div>

      <div class="quiz__result" id="quizResult" hidden>
        <p class="quiz__score" id="quizScore"></p>
        <p class="lead" id="quizMessage"></p>
        <div class="actions">
          <a class="btn btn--primary btn--pulse" href="page7.html">Un petit jeu 💘</a>
        </div>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p>© Léon Corazón — fait avec le cœur</p>
  </footer>

  <div class="page-veil" aria-hidden="true"></div>

  <script src="js/script.js"></script>
</body>

</html>
