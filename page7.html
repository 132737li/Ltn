<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff4f9a" />
  <meta name="description" content="Un petit jeu : attrape les cœurs qui tombent." />
  <title>Attrape mes cœurs</title>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
</head>

<body class="page page--game" data-page="game" data-step="7" data-steps="11" data-fx="fireflies">

  <audio id="pageMusic" src="assets/musique1.mp3" loop preload="auto"></audio>
  <button type="button" class="music-toggle" id="musicToggle" aria-pressed="false"
    aria-label="Activer la musique">🎵</button>

  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

  <main class="stage">
    <section class="card" aria-labelledby="main-title">

      <span class="badge">Un petit jeu 💘</span>

      <h1 class="title" id="main-title">Attrape mes cœurs !</h1>

      <p class="lead">Touche les cœurs qui tombent. Le cœur doré vaut 3 points. ✨</p>

      <div class="game" aria-label="Zone de jeu">
        <div class="game__hud">
          <span class="game__score"><strong id="gameScore">0</strong> / <span id="gameGoal">15</span></span>
          <div class="progress game__progress" aria-hidden="true"><span class="progress__bar" id="gameBar"></span></div>
        </div>
        <div class="game__field" id="gameField"></div>
      </div>

      <p class="game__msg" id="gameMsg" role="status" aria-live="polite">Attrape mon cœur… si tu peux 😏</p>

      <div class="actions">
        <a class="btn btn--ghost" id="gameSkip" href="page8.html" hidden>Passer ›</a>
        <a class="btn btn--primary btn--pulse" id="gameNext" href="page8.html" hidden>Continuer 💗</a>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p>© Léon Corazón — fait avec le cœur</p>
  </footer>

  <div class="page-veil" aria-hidden="true"></div>

  <script src="js/script.js"></script>
</body>

</html>
