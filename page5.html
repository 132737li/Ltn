<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff4f9a" />
  <meta name="description" content="Un petit bout de moi, rien que pour toi." />
  <title>Quelques images</title>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
</head>

<body class="page page--memories" data-page="memories" data-step="5" data-steps="11" data-fx="petals">

  <audio id="pageMusic" src="assets/musique.mp3" loop preload="auto"></audio>
  <button type="button" class="music-toggle" id="musicToggle" aria-pressed="false"
    aria-label="Activer la musique">🎵</button>

  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

  <main class="stage">
    <section class="card" aria-labelledby="main-title">

      <span class="badge">Quelques images 📸</span>

      <h1 class="title" id="main-title">Un petit bout de moi, pour toi</h1>

      <p class="lead">Touche une photo pour l’agrandir. 💕</p>

      <div class="polaroids" id="polaroids">
        <figure class="polaroid" style="--r:-4deg;--delay:0.15s" tabindex="0" role="button"
          aria-label="Agrandir la photo : Des fleurs pour ton sourire 💐">
          <span class="polaroid__pin" aria-hidden="true"></span>
          <img src="assets/photo1.jpg" alt="Une personne en costume bleu tenant un bouquet de fleurs" loading="lazy" />
          <figcaption>Des fleurs pour ton sourire 💐</figcaption>
        </figure>
        <figure class="polaroid" style="--r:3deg;--delay:0.35s" tabindex="0" role="button"
          aria-label="Agrandir la photo : Je pensais à toi 💭">
          <span class="polaroid__pin" aria-hidden="true"></span>
          <img src="assets/photo.png" alt="Une personne en costume bleu avec une cravate rouge" loading="lazy" />
          <figcaption>Je pensais à toi 💭</figcaption>
        </figure>
        <figure class="polaroid" style="--r:-2deg;--delay:0.55s" tabindex="0" role="button"
          aria-label="Agrandir la photo : Mon regard, rien que pour toi 👀">
          <span class="polaroid__pin" aria-hidden="true"></span>
          <img src="assets/photo2.png" alt="Un portrait sous la pluie" loading="lazy" />
          <figcaption>Mon regard, rien que pour toi 👀</figcaption>
        </figure>
      </div>

      <p class="lead lead--strong reveal">Et si on voyait à quel point tu me connais ? 😏</p>

      <div class="actions reveal">
        <a class="btn btn--primary btn--pulse" href="page6.html">Lancer le quiz 🎯</a>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p>© Léon Corazón — fait avec le cœur</p>
  </footer>

  <div class="page-veil" aria-hidden="true"></div>

  <script src="js/script.js"></script>
</body>

</html>
