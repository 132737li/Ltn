<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff4f9a" />
  <meta name="description" content="Six petites raisons qui font battre mon cœur." />
  <title>Ce que j’aime chez toi</title>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
</head>

<body class="page page--reasons" data-page="reasons" data-step="3" data-steps="11" data-fx="stars,petals">

  <audio id="pageMusic" src="assets/musique1.mp3" loop preload="auto"></audio>
  <button type="button" class="music-toggle" id="musicToggle" aria-pressed="false"
    aria-label="Activer la musique">🎵</button>

  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

  <main class="stage">
    <section class="card" aria-labelledby="main-title">

      <span class="badge">Ce que j’aime chez toi 🌸</span>

      <h1 class="title" id="main-title">Six petites raisons…</h1>

      <p class="lead">Touche chaque carte pour découvrir ce qu’elle cache. 💌</p>

      <div class="flip-grid" id="flipGrid">
        <button type="button" class="flip" aria-pressed="false" style="--i:0">
          <span class="flip__inner">
            <span class="flip__face flip__front">
              <span class="flip__emoji" aria-hidden="true">😊</span>
              <span class="flip__label">Ton sourire</span>
              <span class="flip__tap">touche pour découvrir</span>
            </span>
            <span class="flip__face flip__back">
              <span class="flip__title">Ton sourire 😊</span>
              <span class="flip__text">Il illumine mes journées les plus grises, sans même que tu t’en rendes compte.</span>
            </span>
          </span>
        </button>
        <button type="button" class="flip" aria-pressed="false" style="--i:1">
          <span class="flip__inner">
            <span class="flip__face flip__front">
              <span class="flip__emoji" aria-hidden="true">🎶</span>
              <span class="flip__label">Ta voix</span>
              <span class="flip__tap">touche pour découvrir</span>
            </span>
            <span class="flip__face flip__back">
              <span class="flip__title">Ta voix 🎶</span>
              <span class="flip__text">Une mélodie douce que je pourrais écouter pendant des heures.</span>
            </span>
          </span>
        </button>
        <button type="button" class="flip" aria-pressed="false" style="--i:2">
          <span class="flip__inner">
            <span class="flip__face flip__front">
              <span class="flip__emoji" aria-hidden="true">👀</span>
              <span class="flip__label">Ton regard</span>
              <span class="flip__tap">touche pour découvrir</span>
            </span>
            <span class="flip__face flip__back">
              <span class="flip__title">Ton regard 👀</span>
              <span class="flip__text">En un instant, il me fait oublier tout ce qui m’entoure.</span>
            </span>
          </span>
        </button>
        <button type="button" class="flip" aria-pressed="false" style="--i:3">
          <span class="flip__inner">
            <span class="flip__face flip__front">
              <span class="flip__emoji" aria-hidden="true">🌷</span>
              <span class="flip__label">Ta douceur</span>
              <span class="flip__tap">touche pour découvrir</span>
            </span>
            <span class="flip__face flip__back">
              <span class="flip__title">Ta douceur 🌷</span>
              <span class="flip__text">Ta façon d’être avec les autres me rappelle qu’il existe encore de belles choses.</span>
            </span>
          </span>
        </button>
        <button type="button" class="flip" aria-pressed="false" style="--i:4">
          <span class="flip__inner">
            <span class="flip__face flip__front">
              <span class="flip__emoji" aria-hidden="true">😂</span>
              <span class="flip__label">Ton rire</span>
              <span class="flip__tap">touche pour découvrir</span>
            </span>
            <span class="flip__face flip__back">
              <span class="flip__title">Ton rire 😂</span>
              <span class="flip__text">Il est contagieux… et il est devenu mon son préféré.</span>
            </span>
          </span>
        </button>
        <button type="button" class="flip" aria-pressed="false" style="--i:5">
          <span class="flip__inner">
            <span class="flip__face flip__front">
              <span class="flip__emoji" aria-hidden="true">💖</span>
              <span class="flip__label">Ton cœur</span>
              <span class="flip__tap">touche pour découvrir</span>
            </span>
            <span class="flip__face flip__back">
              <span class="flip__title">Ton cœur 💖</span>
              <span class="flip__text">Le plus précieux : sincère, généreux, et tellement toi.</span>
            </span>
          </span>
        </button>
      </div>

      <div class="progress" aria-hidden="true"><span class="progress__bar" id="reasonBar"></span></div>
      <p class="progress__text" id="reasonCount" role="status" aria-live="polite">0 / 6 cartes découvertes</p>

      <div class="actions" id="reasonNext" hidden>
        <a class="btn btn--primary btn--pulse" href="page4.html">Ouvrir ma lettre ✉️</a>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p>© Léon Corazón — fait avec le cœur</p>
  </footer>

  <div class="page-veil" aria-hidden="true"></div>

  <script src="js/script.js"></script>
</body>

</html>
