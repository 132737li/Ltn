<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ff4f9a" />
  <meta name="description" content="J’ai écrit quelques mots… rien que pour toi." />
  <title>Une lettre pour toi</title>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💗</text></svg>" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <script src="js/config.js"></script>
</head>

<body class="page page--letter" data-page="letter" data-step="4" data-steps="11" data-fx="stars,fireflies">

  <audio id="pageMusic" src="assets/musique3.mp3" loop preload="auto"></audio>
  <button type="button" class="music-toggle" id="musicToggle" aria-pressed="false"
    aria-label="Activer la musique">🎵</button>

  <div class="bg-decor" aria-hidden="true">
    <span class="blob blob--1"></span>
    <span class="blob blob--2"></span>
    <span class="blob blob--3"></span>
  </div>

  <div class="hearts-layer" id="heartsLayer" aria-hidden="true"></div>

  <main class="stage">
    <section class="card" aria-labelledby="main-title">

      <span class="badge">Une lettre pour toi ✉️</span>

      <h1 class="title" id="main-title">J’ai écrit ça pour toi…</h1>

      <div class="env-wrap" id="envWrap">
        <button type="button" class="env" id="envelope" aria-label="Ouvrir la lettre">
          <span class="env__back"></span>
          <span class="env__paper"></span>
          <span class="env__left"></span>
          <span class="env__right"></span>
          <span class="env__bottom"></span>
          <span class="env__flap"></span>
          <span class="env__seal" aria-hidden="true">💗</span>
        </button>
        <p class="env-hint">Touche l’enveloppe pour l’ouvrir ✨</p>
      </div>

      <article class="letter" id="letter" hidden aria-label="Ma lettre">
        <p class="letter__to" id="letterTo"></p>
        <div class="letter__body" id="letterBody" aria-live="polite"></div>
        <p class="letter__sign" id="letterSign" hidden></p>
        <p class="letter__skip" id="letterSkip">touche la lettre pour tout afficher</p>
      </article>

      <div class="actions" id="letterNext" hidden>
        <a class="btn btn--primary btn--pulse" href="page5.html">Voir mes images 📸</a>
      </div>

    </section>
  </main>

  <footer class="site-footer">
    <p>© Léon Corazón — fait avec le cœur</p>
  </footer>

  <div class="page-veil" aria-hidden="true"></div>

  <script src="js/script.js"></script>
</body>

</html>
